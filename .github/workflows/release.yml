
name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyinstaller watchdog

      - name: Build executable
        run: python build.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/FileOrganizer.exe

  build-linux:
    name: Build Debian package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyinstaller watchdog

      - name: Build executable
        run: python build.py

      - name: Prepare Debian package
        run: |
          mkdir -p package/opt/tcs-fileorganizer
          mkdir -p package/usr/share/icons/hicolor/512x512/apps

          cp dist/FileOrganizer package/opt/tcs-fileorganizer/
          cp assets/icons/fileorganizer.png package/usr/share/icons/hicolor/512x512/apps/

      - name: Build DEB
        run: |
          dpkg-deb --build --root-owner-group package FileOrganizer_2.5.0_amd64.deb

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: FileOrganizer_2.5.0_amd64.deb

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
